<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090a">
  <meta name="description" content="Créez un lien qui ouvre les publications dans leur application sociale.">
  <meta property="og:title" content="OpenInApp — Ouvrir les réseaux sociaux dans leur application">
  <meta property="og:description" content="Créez un lien pratique à partager dans Instagram et les messageries.">
  <meta property="og:image" content="https://acunamatatah.github.io/OpenInApp/preview.png">
  <meta property="og:image:width" content="1536">
  <meta property="og:image:height" content="1024">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
  <title>OpenInApp — Ouvrir les réseaux sociaux dans leur application</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section id="generator-view" class="card" aria-labelledby="generator-title">
      <div class="brand" aria-hidden="true">↗</div>
      <p class="eyebrow">OpenInApp</p>
      <h1 id="generator-title">Ouvrez les réseaux dans leur application</h1>
      <p class="intro">Collez un lien social. OpenInApp créera un lien pratique à partager dans un DM Instagram.</p>
      <p class="supported">X · Instagram · TikTok · YouTube · Facebook · Threads · Reddit · LinkedIn · Pinterest · Snapchat</p>

      <form id="generator-form" novalidate>
        <label for="social-url">Lien de la publication ou du profil</label>
        <input id="social-url" name="social-url" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://www.tiktok.com/@compte/video/…" required>
        <button class="primary" type="submit">Créer mon lien</button>
      </form>
      <p id="form-message" class="message" role="alert"></p>

      <div id="result" class="result" hidden>
        <p id="detected-network" class="detected"></p>
        <label for="share-url">Votre lien à partager</label>
        <input id="share-url" type="text" readonly>
        <button id="copy-button" class="secondary" type="button">Copier le lien</button>
        <p id="copy-message" class="message success" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
