<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090a">
  <meta name="description" content="Create links that open social content in its mobile app.">
  <meta property="og:title" content="OpenInApp — Open social links in their apps">
  <meta property="og:description" content="Create app-opening links to share on Instagram and messaging apps.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
  <title>OpenInApp — Open social links in their apps</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section id="generator-view" class="card" aria-labelledby="generator-title">
      <div class="brand" aria-hidden="true">↗</div>
      <p class="eyebrow">OpenInApp</p>
      <h1 id="generator-title">Open links in their apps</h1>
      <p class="intro">Paste a social link and share the result anywhere.</p>

      <form id="generator-form" novalidate>
        <label for="social-url">Social media link</label>
        <input id="social-url" name="social-url" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://www.tiktok.com/@compte/video/…" required>
        <button class="primary" type="submit">Create my link</button>
      </form>
      <p id="form-message" class="message" role="alert"></p>

      <div id="result" class="result" hidden>
        <p id="detected-network" class="detected"></p>
        <label for="share-url">Your shareable link</label>
        <input id="share-url" type="text" readonly>
        <button id="copy-button" class="secondary" type="button">Copy link</button>
        <p id="copy-message" class="message success" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
