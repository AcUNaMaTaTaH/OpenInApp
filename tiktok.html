<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090a">
  <meta name="description" content="Open a TikTok video in the app with OpenInApp.">
  <meta property="og:title" content="TikTok — Open in the app">
  <meta property="og:description" content="Open a TikTok video in the app. Tap to continue.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
  <title>TikTok — Open in the app</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-bridge="tiktok">
  <main class="shell">
    <section class="card opener" aria-labelledby="bridge-title">
      <div class="brand pulse" aria-hidden="true">↗</div>
      <p class="eyebrow">OpenInApp · TikTok</p>
      <h1 id="bridge-title">Opening TikTok…</h1>
      <p id="bridge-message" class="intro" role="status">Checking your link…</p>
      <a id="bridge-back" class="button ghost" href="./" hidden>Back to OpenInApp</a>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
